<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fond carré arrondi navy -->
  <rect width="512" height="512" rx="96" fill="#041B4D"/>

  <!-- Cercle principal bleu -->
  <circle cx="210" cy="256" r="150" fill="none" stroke="#ffffff" stroke-width="18"/>

  <!-- Arc orange (partie droite du cercle) -->
  <path d="M 210 106 A 150 150 0 0 1 360 256" fill="none" stroke="#FF6A00" stroke-width="18" stroke-linecap="round"/>

  <!-- Lettre i (point + barre) -->
  <circle cx="174" cy="190" r="16" fill="#FF6A00"/>
  <rect x="162" y="220" width="24" height="100" rx="12" fill="#ffffff"/>

  <!-- Lettre P (barre verticale + demi-cercle) -->
  <rect x="206" y="210" width="22" height="110" rx="11" fill="#ffffff"/>
  <path d="M 228 210 h 32 a 36 36 0 0 1 0 72 h -32 z" fill="#ffffff"/>

  <!-- Poignée de mains stylisée -->
  <g transform="translate(250, 340) scale(0.55)">
    <!-- Main gauche -->
    <path d="M -80 0 C -80 -20 -60 -30 -40 -20 L 0 10 L 20 -10 C 30 -20 50 -15 50 5 L 30 30 L -20 30 Z" fill="#FF6A00" opacity="0.9"/>
    <!-- Main droite -->
    <path d="M 80 0 C 80 -20 60 -30 40 -20 L 0 10 L -20 -10 C -30 -20 -50 -15 -50 5 L -30 30 L 20 30 Z" fill="#ffffff" opacity="0.9"/>
    <!-- Zone de jonction -->
    <ellipse cx="0" cy="5" rx="22" ry="16" fill="#FF6A00" opacity="0.7"/>
  </g>
</svg>
